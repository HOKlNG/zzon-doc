<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>주문 도메인 모델</title>
<style>
/* ---- frame tokens ---- */
:root{--frame-bg:#ffffff;--frame-fg:#09090b;--frame-card:#ffffff;--frame-muted:#f4f4f5;--frame-muted-fg:#71717a;--frame-border:#e4e4e7;--frame-ring:#a1a1aa;--frame-accent:#4f46e5;--frame-accent-fg:#ffffff;--frame-accent-soft:#eef2ff;--frame-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);--frame-shadow-lg:0 10px 30px rgba(0,0,0,.12);}
:root[data-theme="dark"]{--frame-bg:#09090b;--frame-fg:#fafafa;--frame-card:#141417;--frame-muted:#1f1f23;--frame-muted-fg:#a1a1aa;--frame-border:#2a2a2e;--frame-ring:#52525b;--frame-accent:#6366f1;--frame-accent-fg:#ffffff;--frame-accent-soft:#23244a;--frame-shadow:0 1px 2px rgba(0,0,0,.5);--frame-shadow-lg:0 10px 30px rgba(0,0,0,.5);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--frame-bg:#09090b;--frame-fg:#fafafa;--frame-card:#141417;--frame-muted:#1f1f23;--frame-muted-fg:#a1a1aa;--frame-border:#2a2a2e;--frame-ring:#52525b;--frame-accent:#6366f1;--frame-accent-fg:#ffffff;--frame-accent-soft:#23244a;--frame-shadow:0 1px 2px rgba(0,0,0,.5);--frame-shadow-lg:0 10px 30px rgba(0,0,0,.5);}}
:root{--frame-card-fg:var(--frame-fg);--frame-warn-fg:#b45309;--frame-warn-bg:rgba(245,158,11,.1);--frame-warn-border:rgba(245,158,11,.5);--frame-fk:#0284c7;--frame-pk:#f59e0b;}
:root[data-theme="dark"]{--frame-card-fg:var(--frame-fg);--frame-warn-fg:#fbbf24;--frame-warn-bg:rgba(245,158,11,.12);--frame-warn-border:rgba(245,158,11,.45);--frame-fk:#38bdf8;--frame-pk:#fbbf24;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--frame-card-fg:var(--frame-fg);--frame-warn-fg:#fbbf24;--frame-warn-bg:rgba(245,158,11,.12);--frame-warn-border:rgba(245,158,11,.45);--frame-fk:#38bdf8;--frame-pk:#fbbf24;}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",Roboto,sans-serif;background:var(--frame-bg);color:var(--frame-fg);-webkit-font-smoothing:antialiased}
#frame-root{position:fixed;inset:0;overflow:hidden}
.frame-viewport{position:absolute;inset:0;overflow:hidden;background-image:radial-gradient(color-mix(in oklab,var(--frame-border) 72%,transparent) 1px,transparent 1px);background-size:16px 16px}
.frame-icon{display:inline-flex;vertical-align:middle}
.frame-icon svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.frame-ui{position:absolute;z-index:30}
.frame-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:6px;border:1px solid var(--frame-border);background:var(--frame-card);color:var(--frame-fg);font:inherit;font-size:12px;font-weight:500;cursor:pointer;padding:0 10px;height:30px;white-space:nowrap;box-shadow:var(--frame-shadow);transition:background .12s,color .12s,border-color .12s}
.frame-btn:hover{background:var(--frame-muted)}
.frame-btn.icon{width:30px;height:30px;padding:0}
.frame-btn.mini{width:30px;height:30px;padding:0;font-size:9.5px;font-weight:700;letter-spacing:.02em}
.frame-btn.active{border-color:transparent;color:var(--frame-accent-fg);background:var(--frame-accent)}
.frame-btn.active:hover{background:var(--frame-accent);filter:brightness(1.05)}
.frame-titlebar{left:12px;top:12px;display:flex;align-items:center;gap:8px;max-width:64%;border-radius:8px;border:1px solid var(--frame-border);background:color-mix(in oklab,var(--frame-card) 95%,transparent);padding:5px 10px;box-shadow:0 1px 2px rgba(0,0,0,.05);backdrop-filter:blur(6px)}
.frame-kind-chip{display:inline-flex;align-items:center;gap:4px;flex-shrink:0;border-radius:6px;border:1px solid var(--frame-border);background:var(--frame-muted);padding:1px 7px;font-size:10px;font-weight:600;color:var(--frame-muted-fg)}
.frame-title-text{font-size:12.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame-flowcol{left:12px;top:52px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:60%}
.frame-flowsel{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.frame-flowsel .frame-route{color:var(--frame-muted-fg)}
.frame-stepstrip{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:5px 8px;border-radius:9999px;border:1px solid var(--frame-border);background:color-mix(in oklab,var(--frame-card) 95%,transparent);box-shadow:0 1px 2px rgba(0,0,0,.05);backdrop-filter:blur(6px)}
.frame-stepchip{width:22px;height:22px;border-radius:9999px;border:2px solid var(--frame-bg);cursor:pointer;padding:0;font:inherit;font-size:10px;font-weight:700;color:#fff;background:var(--frame-accent);display:inline-flex;align-items:center;justify-content:center;opacity:.78;transition:opacity .12s,box-shadow .12s,transform .12s}
.frame-stepchip:hover{opacity:1}
.frame-stepchip.active{opacity:1;transform:scale(1.1);box-shadow:0 0 0 3px color-mix(in oklab,var(--frame-accent) 30%,transparent)}
.frame-toolbar{right:12px;top:12px;display:flex;flex-direction:column;gap:4px;transition:right .2s ease}
#frame-root.side-open .frame-toolbar{right:320px}
.frame-extras{display:contents}
.frame-warn{left:12px;top:52px}
.frame-warn .chip{display:inline-block;border:1px solid var(--frame-warn-border);background:var(--frame-warn-bg);color:var(--frame-warn-fg);border-radius:6px;padding:2px 8px;font-size:11px}
.frame-legend{bottom:12px;left:12px;max-width:60%;border-radius:8px;border:1px solid var(--frame-border);background:color-mix(in oklab,var(--frame-card) 95%,transparent);padding:6px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06);backdrop-filter:blur(6px)}
.frame-legend summary{list-style:none;cursor:pointer;user-select:none;font-size:11px;font-weight:600;color:var(--frame-muted-fg)}
.frame-legend summary::-webkit-details-marker{display:none}
.frame-legend summary::before{content:"▸";display:inline-block;margin-right:4px}
.frame-legend[open] summary::before{content:"▾"}
.frame-legend-items{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-top:6px}
.frame-legend .item{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--frame-muted-fg)}
.frame-legend .sep{width:1px;height:12px;background:var(--frame-border)}
.frame-legend .sw{flex-shrink:0}
.frame-legend .sw.dot{width:8px;height:8px;border-radius:9999px;display:inline-block}
.frame-side{position:absolute;z-index:40;top:0;right:0;bottom:0;width:304px;display:flex;flex-direction:column;border-left:1px solid var(--frame-border);background:color-mix(in oklab,var(--frame-card) 96%,transparent);backdrop-filter:blur(10px);box-shadow:none;transform:translateX(105%);transition:transform .2s ease}
.frame-side.open{transform:translateX(0);box-shadow:-10px 0 30px rgba(0,0,0,.1)}
.frame-side-head{display:flex;align-items:flex-start;gap:10px;padding:14px;border-bottom:1px solid var(--frame-border)}
.frame-panel-title{font-size:14px;font-weight:600;line-height:1.2}
.frame-panel-sub{font-size:12px;color:var(--frame-muted-fg);margin-top:2px}
.frame-panel-close{margin-left:auto;flex-shrink:0}
.frame-side-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 18px;font-size:12px;line-height:1.6;color:var(--frame-muted-fg)}
.frame-side-desc{margin:0 0 4px}
.frame-side-sec{margin:16px 0 6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in oklab,var(--frame-muted-fg) 80%,transparent)}
.frame-side-body > .frame-side-sec:first-child{margin-top:2px}
.frame-steplist{list-style:none;margin:0;padding:0}
.frame-steplist li{display:flex;gap:8px;font-size:12px;line-height:1.6;cursor:pointer;border-radius:7px;padding:4px 6px;margin:0 -6px 4px;transition:background 120ms}
.frame-steplist li:hover{background:var(--frame-muted)}
.frame-steplist li.active{background:color-mix(in oklab,var(--frame-accent) 16%,transparent)}
.frame-steplist li.active .frame-stepnum{box-shadow:0 0 0 3px color-mix(in oklab,var(--frame-accent) 30%,transparent)}
.frame-stepnum{flex-shrink:0;width:20px;height:20px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:var(--frame-accent);transition:box-shadow 120ms}
.frame-conn{display:flex;align-items:center;gap:7px;padding:5px 8px;margin:0 -8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--frame-fg)}
.frame-conn:hover{background:var(--frame-muted)}
.frame-conn .dir{flex-shrink:0;width:14px;text-align:center;font-weight:700;color:var(--frame-muted-fg)}
.frame-conn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame-conn .kind{margin-left:auto;flex-shrink:0;padding-left:8px;font-size:10px;color:var(--frame-muted-fg)}
.frame-side-col{display:flex;align-items:center;gap:6px;padding:3px 0;font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--frame-fg)}
.frame-side-col .pk-ic{flex-shrink:0;display:inline-flex}
.frame-side-col .t{margin-left:auto;padding-left:8px;font-size:10px;color:color-mix(in oklab,var(--frame-muted-fg) 80%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame-tags{display:flex;flex-shrink:0;gap:2px}
.frame-tag{border-radius:4px;border:1px solid var(--frame-border);padding:1px 4px;font-size:9px;font-weight:500;line-height:1;color:var(--frame-muted-fg)}
.frame-tag.fk{border-color:color-mix(in oklab,#0ea5e9 40%,transparent);background:color-mix(in oklab,#0ea5e9 10%,transparent);color:var(--frame-fk)}
.frame-href{border-top:1px solid var(--frame-border);padding:8px}
.frame-href a{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:28px;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--frame-fg);text-decoration:none}
.frame-href a:hover{background:var(--frame-muted)}
#dg-tip{position:fixed;z-index:1000;left:0;top:0;pointer-events:none;opacity:0;max-width:260px;padding:6px 9px;border-radius:7px;font-size:11.5px;font-weight:500;line-height:1.45;white-space:pre-line;background:var(--frame-fg);color:var(--frame-bg);box-shadow:0 4px 16px rgba(0,0,0,.22);transition:opacity 120ms}
#dg-tip.show{opacity:1}
/* ---- 휴대폰: 떠 있는 크롬은 툴바 열을 피하고, 상세는 아래에서 올라오는 시트 ---- */
@media (max-width:640px){
.frame-titlebar,.frame-flowcol,.frame-legend{max-width:calc(100% - 66px)}
.frame-side{top:auto;left:0;width:auto;height:min(52vh,480px);border-left:0;border-top:1px solid var(--frame-border);border-radius:12px 12px 0 0;transform:translateY(105%)}
.frame-side.open{transform:none;box-shadow:0 -10px 30px rgba(0,0,0,.14)}
#frame-root.side-open .frame-toolbar{right:12px}
#frame-root.side-open .frame-viewport{bottom:min(52vh,480px)} /* 그림은 시트 위 남은 칸에 다시 맞춰진다 */
#frame-root.side-open .frame-legend{display:none}
}
/* ---- 손가락 입력: 누르기 쉬운 크기 ---- */
@media (pointer:coarse){
.frame-btn{height:36px}
.frame-btn.icon,.frame-btn.mini{width:36px;height:36px}
.frame-stepchip{width:28px;height:28px}
}
/* ---- 440px 위키 엠베드: 컴팩트 툴바(≤44px) — 폭이 좁으면 세로 열을 유지한다 ---- */
@media (max-height:460px) and (min-width:641px){
.frame-toolbar{flex-direction:row;gap:4px}
#frame-root.side-open .frame-toolbar{right:316px}
.frame-btn{height:24px}
.frame-btn.icon{width:24px;height:24px}
.frame-btn.mini{width:auto;height:24px;padding:0 6px}
.frame-titlebar{max-width:46%}
.frame-legend{max-width:46%}
}
@media (prefers-reduced-motion:reduce){
.frame-side,.frame-toolbar,.frame-stepchip,.frame-btn,#dg-tip{transition:none}
}

svg.ia-svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none;transition:transform .2s ease}

.node,.edge{transition:opacity .15s ease}
svg.ia-svg [stroke="#52525b"]{stroke:var(--ia-edge)}
svg.ia-svg [fill="#52525b"]{fill:var(--ia-edge)}
.dim{opacity:var(--ia-dim,.25)}
.hl{opacity:1}

@keyframes ia-sonar{0%{filter:drop-shadow(0 0 0px rgba(79,70,229,.85))}70%{filter:drop-shadow(0 0 9px rgba(79,70,229,0))}100%{filter:drop-shadow(0 0 0px rgba(79,70,229,0))}}

.flow-badges{display:none}
.flow-badges.active{display:initial}
.flow-badge{cursor:pointer}
.flow-badge text{user-select:none}
.flow-badge.on circle{stroke:#FFFFFF;stroke-width:2.5}
.flow-dim{opacity:.25}
.flow-fade{opacity:.5}
.edge.flow-hl path{stroke:var(--flow,#4f46e5);stroke-width:2.25}
.step-focus .edge.flow-hl.flow-fade path{stroke:var(--ia-edge,#52525b);stroke-width:1.5}
.step-focus .flow-badges [data-steps]:not(.on){opacity:.35}
@keyframes flow-pop{to{transform:scale(1)}}
.flow-badges.active .flow-badge{transform:scale(0);transform-box:fill-box;transform-origin:center;animation:flow-pop 280ms cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(var(--step-index,0)*220ms + 120ms)}
@media (prefers-reduced-motion:reduce){.flow-badges.active .flow-badge{animation:none;transform:scale(1)}}

<script>
"use strict";
(function () {
  var P = window.__zzonFramePayload || {};
  var S = window.__zzonFrameStr || {};
  var I = window.__zzonFrameIcons || {};
  var doc = document;
  var rootHtml = doc.documentElement;
  var frameRoot = doc.getElementById("frame-root");
  var viewport = doc.getElementById("frame-viewport");
  var side = doc.getElementById("frame-side");
  var tipEl = doc.getElementById("dg-tip");
  var stripEl = doc.getElementById("frame-stepstrip");

  var nodes = P.nodes || [];
  var edges = P.edges || [];
  var flows = P.flows || [];
  var nodeByPath = {};
  for (var ni = 0; ni < nodes.length; ni++) nodeByPath[nodes[ni].path] = nodes[ni];
  function flowById(id) {
    for (var i = 0; i < flows.length; i++) if (flows[i].id === id) return flows[i];
    return null;
  }

  /* ---- DOM \uC720\uD2F8 ---- */
  function el(tag, cls, text) {
    var d = doc.createElement(tag);
    if (cls) d.className = cls;
    if (text != null) d.appendChild(doc.createTextNode(String(text)));
    return d;
  }
  function icon(name, size, color) {
    var sp = el("span", "frame-icon");
    sp.setAttribute("aria-hidden", "true");
    sp.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="' +
      size + '" height="' + size + '">' + (I[name] || "") + "</svg>";
    if (color) sp.style.color = color;
    return sp;
  }

  /* ---- \uD234\uD301 \uC2F1\uAE00\uD134 (#dg-tip, \u00A72) \u2014 data-tip \uC704\uC784 + frame.tooltip(el, text) \uC720\uD2F8 ---- */
  function placeTip(e) {
    var r = tipEl.getBoundingClientRect();
    var x = e.clientX + 14, y = e.clientY + 16;
    if (x + r.width > window.innerWidth - 8) x = e.clientX - 14 - r.width;
    if (y + r.height > window.innerHeight - 8) y = e.clientY - 12 - r.height;
    tipEl.style.left = Math.max(8, x) + "px";
    tipEl.style.top = Math.max(8, y) + "px";
  }
  function hideTip() { tipEl.classList.remove("show"); }
  function tooltip(target, text) {
    if (target && text != null && text !== "") target.setAttribute("data-tip", String(text));
    return target;
  }
  doc.addEventListener("mouseover", function (e) {
    var t = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
    if (!t) return;
    tipEl.textContent = t.getAttribute("data-tip") || "";
    tipEl.classList.add("show");
    placeTip(e);
  });
  doc.addEventListener("mousemove", function (e) {
    if (tipEl.classList.contains("show")) placeTip(e);
  });
  doc.addEventListener("mouseout", function (e) {
    var t = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
    if (t) hideTip();
  });

  /* ---- \uC178 \uD504\uB85C\uD1A0\uCF5C (\u00A74): parent !== window \uAC00\uB4DC \u2014 zzon:* 3\uC885 \uC678 \uAE08\uC9C0 ---- */
  function postMsg(msg) {
    if (window.parent !== window) window.parent.postMessage(msg, "*");
  }

  /* ---- \uD14C\uB9C8 (\u00A74, \uC815\uBCF8 = seq \uC758\uBBF8\uB860): localStorage "zzon-theme" \u2192 <html data-theme>,
         \uBD80\uD2B8 \uC2DC prefers-color-scheme \uD3F4\uBC31, storage \uC774\uBCA4\uD2B8\uB85C \uD615\uC81C iframe \uB3D9\uAE30\uD654 ---- */
  function currentTheme() {
    return rootHtml.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }
  function stampTheme(t) {
    rootHtml.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    updateThemeBtn();
  }
  function bootTheme() {
    var t = null;
    try { t = localStorage.getItem("zzon-theme"); } catch (_) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light";
    }
    stampTheme(t);
  }
  function toggleTheme() {
    var next = currentTheme() === "dark" ? "light" : "dark";
    try { localStorage.setItem("zzon-theme", next); } catch (_) {}
    stampTheme(next);
  }
  window.addEventListener("storage", function (e) {
    if (e.key === "zzon-theme" && (e.newValue === "light" || e.newValue === "dark")) {
      stampTheme(e.newValue);
    }
  });

  /* ---- \uC5B4\uB311\uD130 + \uD558\uC774\uB77C\uC774\uD2B8 \uC0C1\uD0DC \uBA38\uC2E0 (\u00A72: \uC8FC\uC778\uC740 \uD504\uB808\uC784, \uC6B0\uC120\uC21C\uC704 hover<select<flow<step) ---- */
  var adapter = null;
  var st = { hovered: null, selected: null, flowId: null, step: null };
  var labelMode = "auto";
  var sideOpen = false;
  function callAdapter(name) {
    if (!adapter || typeof adapter[name] !== "function") return null;
    try { return adapter[name].apply(adapter, Array.prototype.slice.call(arguments, 1)); }
    catch (err) { console.warn("[zzon-frame] " + S.adapterFail + " " + name, err); return null; }
  }
  function syncHighlight() {
    /* \uC5B4\uB311\uD130\uB294 \uBAA8\uB4DC\uBCC4 \uC0C1\uD0DC\uB97C \uB204\uC801\uD55C\uB2E4 \u2014 \uD65C\uC131 \uBAA8\uB4DC\uB9CC \uBCF4\uB0B4\uBA74 \uAEBC\uC9C4 \uBAA8\uB4DC\uAC00
       \uCE94\uBC84\uC2A4\uC5D0 \uC794\uC0C1\uC73C\uB85C \uB0A8\uB294\uB2E4(\uC608: \uD50C\uB85C\uC6B0 \uD574\uC81C \uD6C4 dim \uC794\uB958). \uAEBC\uC9C4 \uBAA8\uB4DC\uB294
       target null \uD574\uC81C(\u00A72)\uB97C \uBA85\uC2DC\uC801\uC73C\uB85C \uBCF4\uB0B8 \uB4A4 \uD65C\uC131 \uBAA8\uB4DC\uB97C \uC801\uC6A9\uD55C\uB2E4. */
    var mode = st.flowId && st.step != null ? "step"
      : st.flowId ? "flow"
      : st.selected ? "select"
      : st.hovered ? "hover" : null;
    if (mode !== "flow" && mode !== "step") callAdapter("highlight", "flow", null);
    if (mode !== "select") callAdapter("highlight", "select", null);
    if (mode !== "hover") callAdapter("highlight", "hover", null);
    if (mode === "step") callAdapter("highlight", "step", { flowId: st.flowId, step: st.step });
    else if (mode === "flow") callAdapter("highlight", "flow", { flowId: st.flowId });
    else if (mode === "select") callAdapter("highlight", "select", { path: st.selected });
    else if (mode === "hover") callAdapter("highlight", "hover", { path: st.hovered });
  }

  /* ---- \uC6B0\uCE21 \uC0AC\uC774\uB4DC\uBC14: \uC5F4\uB9BC/\uB2EB\uD798 + canvasShift(\u00B1152) + zzon:sidebar \uD1B5\uC9C0 ---- */
  var NARROW_PX = window.__zzonFrameNarrow || 640, shifted = false; // \uD734\uB300\uD3F0 \uD3ED\uC5D0\uC120 \uC0C1\uC138\uAC00 \uC544\uB798 \uC2DC\uD2B8\uB77C \uCE94\uBC84\uC2A4\uB97C \uC606\uC73C\uB85C \uBC00\uC9C0 \uC54A\uB294\uB2E4
  function setSideOpen(open) {
    open = !!open;
    if (sideOpen === open) return;
    sideOpen = open;
    side.classList.toggle("open", open);
    frameRoot.classList.toggle("side-open", open);
    var wantShift = open && window.innerWidth > NARROW_PX;
    if (wantShift !== shifted) { callAdapter("canvasShift", wantShift ? -152 : 152); shifted = wantShift; }
    postMsg({ type: "zzon:sidebar", open: open });
  }
  function sideHead(title, sub, onClose) {
    var head = el("div", "frame-side-head");
    var txt = el("div");
    txt.appendChild(el("div", "frame-panel-title", title));
    if (sub) txt.appendChild(el("div", "frame-panel-sub", sub));
    head.appendChild(txt);
    var close = el("button", "frame-btn icon frame-panel-close");
    close.type = "button";
    close.setAttribute("aria-label", S.close);
    tooltip(close, S.close);
    close.appendChild(icon("X", 14));
    close.addEventListener("click", onClose);
    head.appendChild(close);
    return head;
  }
  /* \uB178\uB4DC \uD328\uB110 \u2014 payload.nodes + edges[].from/to \uD30C\uC0DD \uC5F0\uACB0 \uBAA9\uB85D (\u00A71: \uC5C6\uB294 endpoint\uB294 \uAC74\uB108\uB700) */
  function renderNodeSide(node) {
    side.innerHTML = "";
    // \uBD80\uC81C\uB294 \uC77D\uB294 \uC0AC\uB78C\uC758 \uB9D0\uB85C: \uBC94\uC8FC \uC774\uB984(\uD55C\uAD6D\uC5B4)\uACFC \uAE30\uC220. \uBC94\uC8FC id(user \uB4F1)\uB294 \uBCF4\uC774\uC9C0 \uC54A\uB294\uB2E4
    var sub = [node.categoryLabel, node.tech].filter(Boolean).join(" \u00B7 ");
    side.appendChild(sideHead(node.label || node.path, sub, function () {
      st.selected = null;
      setSideOpen(false);
      syncHighlight();
    }));
    var body = el("div", "frame-side-body");
    if (node.description) body.appendChild(el("p", "frame-side-desc", node.description));
    if (node.table && node.table.columns && node.table.columns.length) {
      body.appendChild(el("div", "frame-side-sec", S.columns + " " + node.table.columns.length));
      node.table.columns.forEach(function (c) {
        var row = el("div", "frame-side-col");
        if (c.pk) {
          var pk = el("span", "pk-ic");
          pk.appendChild(icon("KeyRound", 11, "var(--frame-pk)"));
          row.appendChild(pk);
        }
        row.appendChild(el("span", null, c.name));
        var tags = el("span", "frame-tags");
        if (c.fk) tags.appendChild(el("span", "frame-tag fk", S.tagFk));
        if (c.unique) tags.appendChild(el("span", "frame-tag", S.tagUq));
        if (c.nullable) tags.appendChild(el("span", "frame-tag", S.tagNullable));
        if (tags.childNodes.length) row.appendChild(tags);
        row.appendChild(el("span", "t", c.type || ""));
        if (c.fk && c.fk.table) tooltip(row, S.fkArrow + c.fk.table + "." + c.fk.column);
        body.appendChild(row);
      });
    }
    var rows = [];
    edges.forEach(function (e) {
      if (e.from !== node.path && e.to !== node.path) return;
      var outgoing = e.from === node.path;
      var other = nodeByPath[outgoing ? e.to : e.from];
      if (!other) return;
      rows.push({ edge: e, other: other, outgoing: outgoing });
    });
    if (rows.length) {
      body.appendChild(el("div", "frame-side-sec", S.connections));
      rows.forEach(function (r) {
        var row = el("div", "frame-conn");
        row.appendChild(el("span", "dir", r.outgoing ? S.dirOut : S.dirIn));
        row.appendChild(el("span", "lbl", r.other.label || r.other.path));
        row.appendChild(el("span", "kind", r.edge.label || ""));
        row.addEventListener("click", function () { selectNode(r.other.path); });
        body.appendChild(row);
      });
    }
    side.appendChild(body);
    if (node.href) {
      var wrap = el("div", "frame-href");
      var a = el("a");
      a.href = "#";
      a.title = node.href;
      a.appendChild(doc.createTextNode(S.detailPrefix + node.href));
      a.appendChild(icon("ZoomIn", 14));
      a.addEventListener("click", function (ev) { ev.preventDefault(); navigateHref(node.href); });
      wrap.appendChild(a);
      side.appendChild(wrap);
    }
    setSideOpen(true);
  }
  /* \uD50C\uB85C\uC6B0 \uD328\uB110 \u2014 \uB2E8\uACC4 \uBAA9\uB85D \uD074\uB9AD = \uC2A4\uD15D \uD3EC\uCEE4\uC2A4 */
  function renderFlowSide(flow) {
    side.innerHTML = "";
    var steps = flow.steps || [];
    side.appendChild(sideHead(flow.title || flow.id, steps.length + S.steps, function () {
      setFlow(null);
    }));
    var body = el("div", "frame-side-body");
    if (flow.description) body.appendChild(el("p", "frame-side-desc", flow.description));
    body.appendChild(el("div", "frame-side-sec", S.steps));
    var ol = el("ol", "frame-steplist");
    steps.forEach(function (sp, i) {
      var n = sp.n != null ? sp.n : i + 1;
      var li = el("li");
      li.setAttribute("data-step", String(n));
      li.appendChild(el("span", "frame-stepnum", String(n)));
      li.appendChild(el("span", null, sp.text || ""));
      li.addEventListener("click", function () { setActiveStep(n); });
      ol.appendChild(li);
    });
    body.appendChild(ol);
    side.appendChild(body);
    setSideOpen(true);
  }

  /* ---- \uD50C\uB85C\uC6B0 \uBC84\uD2BC / \uC21C\uBC88 \uC2A4\uD2B8\uB9BD / \uC2A4\uD15D \uD3EC\uCEE4\uC2A4 ---- */
  function renderStepStrip(flow) {
    if (!stripEl) return;
    stripEl.innerHTML = "";
    if (!flow) { stripEl.style.display = "none"; return; }
    stripEl.style.display = "";
    (flow.steps || []).forEach(function (sp, i) {
      var n = sp.n != null ? sp.n : i + 1;
      var b = el("button", "frame-stepchip", String(n));
      b.type = "button";
      b.setAttribute("data-step", String(n));
      tooltip(b, n + ". " + (sp.text || ""));
      b.addEventListener("click", function () { setActiveStep(n); });
      stripEl.appendChild(b);
    });
  }
  function updateFlowButtons() {
    var btns = doc.querySelectorAll("[data-flow-id]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("active", btns[i].getAttribute("data-flow-id") === st.flowId);
    }
  }
  function updateStepMarks() {
    var target = null;
    var items = doc.querySelectorAll("[data-step]");
    for (var i = 0; i < items.length; i++) {
      var on = Number(items[i].getAttribute("data-step")) === st.step;
      items[i].classList.toggle("active", on);
      if (on && items[i].tagName === "LI") target = items[i];
    }
    if (target && target.scrollIntoView) target.scrollIntoView({ block: "nearest" });
  }
  function setFlow(id) {
    st.selected = null;
    st.flowId = id || null;
    st.step = null;
    hideTip();
    updateFlowButtons();
    var flow = st.flowId ? flowById(st.flowId) : null;
    renderStepStrip(flow);
    if (flow) renderFlowSide(flow);
    else setSideOpen(false);
    updateStepMarks();
    syncHighlight();
  }
  function setActiveStep(n) {
    st.step = st.step === n ? null : n;
    updateStepMarks();
    syncHighlight();
  }
  function selectNode(path) {
    st.flowId = null;
    st.step = null;
    updateFlowButtons();
    renderStepStrip(null);
    st.selected = st.selected === path ? null : path;
    var node = st.selected ? nodeByPath[st.selected] : null;
    if (node) renderNodeSide(node);
    else { st.selected = null; setSideOpen(false); }
    syncHighlight();
  }
  function clearSelection() {
    if (st.flowId) { setFlow(null); return; }
    if (st.selected) {
      st.selected = null;
      setSideOpen(false);
      syncHighlight();
      return;
    }
    setSideOpen(false);
  }

  /* ---- \uB4DC\uB9B4\uB2E4\uC6B4 (\u00A75 \uB2E8\uC77C \uADDC\uCE59) ---- */
  function navigateHref(href) {
    if (!href) return;
    if (/^[a-z][a-z0-9+.-]*:/.test(href)) {
      window.open(href, "_blank", "noopener");
      return;
    }
    var slug = String(href).replace(/\.html$/, "");
    if (/^[a-z0-9_-]+$/.test(slug)) {
      if (window.parent !== window) postMsg({ type: "zzon:navigate", slug: slug });
      else window.location.href = slug + ".html";
      return;
    }
    console.warn("[zzon-frame] " + S.badHref + " " + href);
  }

  /* ---- \uB0B4\uBCF4\uB0B4\uAE30 (\u00A76): adapter.export(kind) \uC6B0\uC120 \u2192 payload.assets \uB2E4\uC6B4\uB85C\uB4DC \uD3F4\uBC31 ---- */
  function downloadBlob(name, blob) {
    var a = doc.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    doc.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
  }
  function downloadAsset(file) {
    var a = doc.createElement("a");
    a.href = file;
    a.download = "";
    doc.body.appendChild(a);
    a.click();
    a.remove();
  }
  function exportKind(kind) {
    var name = (P.id || "diagram") + "." + kind;
    Promise.resolve(callAdapter("export", kind)).then(function (blob) {
      if (blob) { downloadBlob(name, blob); return; }
      var assets = P.assets || {};
      var file = kind === "svg" ? assets.svgFile : assets.pngFile;
      if (file) downloadAsset(file);
      else console.warn("[zzon-frame] " + S.noExportAsset + " " + kind);
    });
  }

  /* ---- \uD234\uBC14 \uBC30\uC120 (fit \u00B7 reset \u00B7 \uB77C\uBCA8 \uD1A0\uAE00 \u00B7 SVG \u00B7 PNG \u00B7 \uD14C\uB9C8 + \uCE94\uBC84\uC2A4 extras \uC2AC\uB86F) ---- */
  var themeBtn = null;
  var labelBtn = null;
  function onAct(act, fn) {
    var b = doc.querySelector('[data-act="' + act + '"]');
    if (b) b.addEventListener("click", fn);
    return b;
  }
  onAct("fit", function () { callAdapter("fit"); });
  onAct("reset", function () { callAdapter("reset"); });
  labelBtn = onAct("labels", function () {
    labelMode = labelMode === "always" ? "auto" : "always";
    if (labelBtn) labelBtn.classList.toggle("active", labelMode === "always");
    callAdapter("setLabelMode", labelMode);
  });
  onAct("export-svg", function () { exportKind("svg"); });
  onAct("export-png", function () { exportKind("png"); });
  themeBtn = onAct("theme", toggleTheme);
  function updateThemeBtn() {
    if (!themeBtn) return;
    themeBtn.innerHTML = "";
    themeBtn.appendChild(icon(currentTheme() === "dark" ? "Sun" : "Moon", 14));
  }

  /* ---- \uD50C\uB85C\uC6B0 \uBC84\uD2BC \uBC30\uC120 (\uBE4C\uB4DC\uD0C0\uC784 \uD06C\uB86C) ---- */
  (function () {
    var btns = doc.querySelectorAll("[data-flow-id]");
    for (var i = 0; i < btns.length; i++) {
      (function (b) {
        b.addEventListener("click", function () {
          var id = b.getAttribute("data-flow-id");
          setFlow(st.flowId === id ? null : id);
        });
      })(btns[i]);
    }
  })();

  /* ---- \uCE94\uBC84\uC2A4 \u2192 \uD504\uB808\uC784 \uCF5C\uBC31 (\u00A72: \uD504\uB808\uC784\uC774 \uC5B4\uB311\uD130\uC5D0 \uC8FC\uC785\uD55C\uB2E4) ---- */
  var callbacks = {
    onNodeSelected: function (path) {
      if (path == null) {
        if (st.selected) { st.selected = null; setSideOpen(false); syncHighlight(); }
        return;
      }
      selectNode(path);
    },
    onNodeActivated: function (path) {
      var node = nodeByPath[path];
      if (node && node.href) navigateHref(node.href);
    },
    onStepClicked: function (flowId, n) {
      if (st.flowId !== flowId) setFlow(flowId);
      setActiveStep(n);
    },
    onHover: function (path) {
      st.hovered = path || null;
      syncHighlight();
    },
  };

  /* ---- register (\u00A72) ---- */
  var booted = false;
  function register(a) {
    if (!a || typeof a !== "object") {
      console.warn("[zzon-frame] " + S.needAdapter);
      return api;
    }
    adapter = a;
    if (a.el && viewport && a.el.parentNode !== viewport) viewport.appendChild(a.el);
    for (var k in callbacks) {
      if (Object.prototype.hasOwnProperty.call(callbacks, k)) a[k] = callbacks[k];
    }
    var extras = callAdapter("toolbarExtras");
    var slot = doc.getElementById("frame-extras");
    if (extras && slot) { slot.innerHTML = ""; slot.appendChild(extras); }
    callAdapter("setLabelMode", labelMode);
    if (!booted) {
      booted = true;
      /* \uBD80\uD2B8 fit: \uB808\uC774\uC544\uC6C3 \uC548\uC815\uD654 \uD6C4 (440px \uC5E0\uBCA0\uB4DC \uD3EC\uD568, \u00A74) */
      if (window.requestAnimationFrame) requestAnimationFrame(function () { callAdapter("fit"); });
      else callAdapter("fit");
      if (doc.fonts && doc.fonts.ready && doc.fonts.ready.then) {
        doc.fonts.ready.then(function () { callAdapter("refresh"); }).catch(function () {});
      }
    }
    return api;
  }

  /* ---- \uC804\uC5ED \uB9AC\uC2A4\uB108: \uC178 \uBA54\uC2DC\uC9C0 \u00B7 Escape \u00B7 \uB9AC\uC0AC\uC774\uC988/\uC5E0\uBCA0\uB4DC ---- */
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (d && d.type === "zzon:sidebar-close") clearSelection();
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && (st.flowId || st.selected || sideOpen)) clearSelection();
  });
  var wasCompact = false;
  function applyEmbedMode() {
    var compact = window.innerHeight <= 460;
    if (compact && !wasCompact) {
      var lg = doc.getElementById("frame-legend");
      if (lg) lg.removeAttribute("open");
    }
    wasCompact = compact;
    frameRoot.classList.toggle("compact", compact);
  }
  window.addEventListener("resize", function () {
    applyEmbedMode();
    callAdapter("refresh");
  });

  /* ---- \uBD80\uD2B8 ---- */
  bootTheme();
  applyEmbedMode();

  var api = { register: register, tooltip: tooltip, payload: P };
  window.__zzonFrame = api;
})();
</script>
<script>
(function () {
  "use strict";
  var svg = document.querySelector("svg.ia-svg");
  if (!svg) return;

  /* ---- pan / zoom (viewBox-based; the canvas owns pan/zoom) ---- */
  var vb0 = (svg.getAttribute("viewBox") || "0 0 100 100").split(/\s+/).map(Number);
  var vb = vb0.slice();
  var MIN_ZOOM = 0.2, MAX_ZOOM = 8, LABEL_ZOOM = 0.75;
  var labelMode = "auto";
  var base = vb0[2]; /* viewBox width of the last fit — zoom 1 */
  function zoomLevel() { return base / vb[2]; }
  function applyVB() {
    svg.setAttribute("viewBox", vb.join(" "));
    svg.classList.toggle("labels-off", labelMode === "auto" && zoomLevel() < LABEL_ZOOM);
  }
  /* The frame floats its title bar + flow buttons (top-left), toolbar (right)
     and legend (bottom-left) over the canvas. A plain fit lets them cover the
     drawing's edges, so the fit leaves those strips free: measure the
     overlays and fit the drawing into the rectangle that remains. */
  function overlayInsets(r) {
    var ins = { t: 0, r: 0, b: 0, l: 0 };
    function box(sel) {
      var el = document.querySelector(sel);
      if (!el || !el.offsetParent) return null;
      var b = el.getBoundingClientRect();
      return b.width && b.height ? b : null;
    }
    var tops = [".frame-titlebar", ".frame-flowcol"];
    for (var i = 0; i < tops.length; i++) {
      var b = box(tops[i]);
      if (b && b.top < r.top + r.height / 2) ins.t = Math.max(ins.t, b.bottom - r.top + 8);
    }
    var lg = box(".frame-legend");
    if (lg && lg.top > r.top + r.height / 2) ins.b = Math.max(ins.b, r.bottom - lg.top + 8);
    var tb = box(".frame-toolbar");
    if (tb && tb.left > r.left + r.width / 2) ins.r = Math.max(ins.r, r.right - tb.left + 8);
    return ins;
  }
  function fitView() {
    vb = vb0.slice();
    var r = svg.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      var ins = overlayInsets(r);
      var iw = r.width - ins.l - ins.r, ih = r.height - ins.t - ins.b;
      /* only when enough room is left — on tiny canvases the overlays win */
      if ((ins.t || ins.b || ins.r) && iw > r.width * 0.5 && ih > r.height * 0.5) {
        var s = Math.min(iw / vb0[2], ih / vb0[3]);
        var w = r.width / s, h = r.height / s;
        vb = [vb0[0] - (ins.l + (iw - vb0[2] * s) / 2) / s, vb0[1] - (ins.t + (ih - vb0[3] * s) / 2) / s, w, h];
      }
    }
    base = vb[2];
    applyVB();
  }
  /* On a phone-width canvas a whole-diagram fit shrinks text past reading
     size, so the FIRST fit (frame boot) opens at a readable zoom from the
     top-left instead; the fit button and dblclick still show everything. */
  var READABLE_ZOOM = 0.6, TALL_READABLE = 0.55, NARROW_PX = 640, booted = false;
  function bootView() {
    var r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return fitView();
    if (r.width > NARROW_PX) {
      /* A long top-to-bottom drawing (a 20-step flowchart) fitted whole is
         too small to read on a wide screen. Open it at its width — never
         above 1:1 — from the top; the fit button still shows all of it. */
      fitView();
      var whole = Math.min(r.width / vb0[2], r.height / vb0[3]);
      var ins = overlayInsets(r);
      var across = Math.min(1, (r.width - ins.l - ins.r) / vb0[2]);
      if (whole >= TALL_READABLE || across < whole * 1.6) return;
      vb = [vb0[0] - (r.width - vb0[2] * across) / 2 / across, vb0[1] - ins.t / across, r.width / across, r.height / across];
      applyVB();
      return;
    }
    if (Math.min(r.width / vb0[2], r.height / vb0[3]) >= READABLE_ZOOM) return fitView();
    var w = r.width / READABLE_ZOOM, h = r.height / READABLE_ZOOM;
    vb = [vb0[0] + Math.min(0, (vb0[2] - w) / 2), vb0[1] + Math.min(0, (vb0[3] - h) / 2), w, h];
    applyVB();
  }

  /* Pointer capture retargets the subsequent click to the svg root, which
     breaks closest(".node") hit-testing — so capture is deferred until the
     drag threshold is crossed (a plain click never captures), and the
     pointerdown target is kept as a fallback for retargeted clicks. */
  var pan = null, moved = false, downTarget = null;
  /* two-finger pinch on touch screens: zoom around the fingers' midpoint */
  var touches = {}, pinch = null;
  function touchList() { return Object.keys(touches).map(function (k) { return touches[k]; }); }
  function pinchState() {
    var t = touchList(), r = svg.getBoundingClientRect();
    var cx = (t[0].x + t[1].x) / 2, cy = (t[0].y + t[1].y) / 2;
    return { d: Math.max(1, Math.hypot(t[0].x - t[1].x, t[0].y - t[1].y)), cx: cx, cy: cy, r: r };
  }
  svg.addEventListener("pointerdown", function (ev) {
    if (ev.pointerType === "touch") {
      touches[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
      if (touchList().length === 2) {
        var p = pinchState();
        pan = null; moved = true;
        pinch = { d: p.d, vb: vb.slice(),
          px: vb[0] + ((p.cx - p.r.left) / p.r.width) * vb[2],
          py: vb[1] + ((p.cy - p.r.top) / p.r.height) * vb[3] };
        return;
      }
    }
    if (ev.button !== 0) return;
    moved = false;
    downTarget = ev.target instanceof Element ? ev.target : null;
    pan = { x: ev.clientX, y: ev.clientY, id: ev.pointerId, vb: vb.slice() };
  });
  svg.addEventListener("pointermove", function (ev) {
    if (touches[ev.pointerId]) touches[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    if (pinch && touchList().length === 2) {
      var p = pinchState();
      var zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, (base / pinch.vb[2]) * (p.d / pinch.d)));
      vb[2] = base / zoom;
      vb[3] = pinch.vb[3] * (vb[2] / pinch.vb[2]);
      vb[0] = pinch.px - ((p.cx - p.r.left) / p.r.width) * vb[2];
      vb[1] = pinch.py - ((p.cy - p.r.top) / p.r.height) * vb[3];
      applyVB();
      return;
    }
    if (!pan) return;
    if (!moved && Math.abs(ev.clientX - pan.x) + Math.abs(ev.clientY - pan.y) > 3) {
      moved = true;
      if (svg.setPointerCapture) {
        try { svg.setPointerCapture(pan.id); } catch (_) {}
      }
    }
    if (!moved) return;
    var r = svg.getBoundingClientRect();
    vb[0] = pan.vb[0] - ((ev.clientX - pan.x) / r.width) * pan.vb[2];
    vb[1] = pan.vb[1] - ((ev.clientY - pan.y) / r.height) * pan.vb[3];
    applyVB();
  });
  ["pointerup", "pointercancel"].forEach(function (type) {
    svg.addEventListener(type, function (ev) {
      delete touches[ev.pointerId];
      if (touchList().length < 2) pinch = null;
      pan = null;
    });
  });
  svg.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var r = svg.getBoundingClientRect();
    var px = vb[0] + ((ev.clientX - r.left) / r.width) * vb[2];
    var py = vb[1] + ((ev.clientY - r.top) / r.height) * vb[3];
    var factor = Math.pow(1.0015, ev.deltaY);
    var zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, base / (vb[2] * factor)));
    factor = base / zoom / vb[2];
    vb[0] = px - (px - vb[0]) * factor;
    vb[1] = py - (py - vb[1]) * factor;
    vb[2] = vb[2] * factor;
    vb[3] = vb[3] * factor;
    applyVB();
  }, { passive: false });

  /* ---- element indexes ---- */
  var slice = function (list) { return Array.prototype.slice.call(list); };
  var nodes = slice(svg.querySelectorAll(".node[data-path]"));
  var edges = slice(svg.querySelectorAll(".edge[data-edge-id]"));
  var layers = slice(svg.querySelectorAll(".flow-badges[data-flow]"));
  function nodeByPath(path) {
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].getAttribute("data-path") === path) return nodes[i];
    }
    return null;
  }
  function badgesOf(flowId) {
    for (var i = 0; i < layers.length; i++) {
      if (layers[i].getAttribute("data-flow") === flowId) {
        return slice(layers[i].querySelectorAll(".flow-badge"));
      }
    }
    return [];
  }
  function stepsOf(badge) {
    return (badge.getAttribute("data-steps") || "").split(" ").map(Number);
  }

  /* ---- highlight state (the FRAME owns priority; we only reflect) ---- */
  var state = { hover: null, select: null, flow: null, step: null };

  function applyHighlight() {
    /* hover/select neighborhood: focused node + incident edges + neighbors */
    var lit = {}, litEdges = {}, focusOn = false;
    [state.select, state.hover].forEach(function (path) {
      if (path === null) return;
      focusOn = true;
      lit[path] = true;
      edges.forEach(function (edge) {
        var from = edge.getAttribute("data-from");
        var to = edge.getAttribute("data-to");
        if (from !== path && to !== path) return;
        litEdges[edge.getAttribute("data-edge-id")] = true;
        lit[from] = true;
        lit[to] = true;
      });
    });
    nodes.forEach(function (node) {
      var p = node.getAttribute("data-path");
      node.classList.toggle("hl", focusOn && !!lit[p]);
      node.classList.toggle("dim", focusOn && !lit[p]);
      node.classList.toggle("sel", state.select !== null && p === state.select);
    });
    edges.forEach(function (edge) {
      var on = !!litEdges[edge.getAttribute("data-edge-id")];
      edge.classList.toggle("hl", focusOn && on);
      edge.classList.toggle("dim", focusOn && !on);
    });

    /* flow/step: badge layer + on-path highlight + step focus fade */
    var flowOn = state.flow !== null;
    svg.classList.toggle("step-focus", flowOn && state.step !== null);
    layers.forEach(function (l) {
      l.classList.toggle("active", l.getAttribute("data-flow") === state.flow);
    });
    var edgeSteps = {};
    badgesOf(state.flow).forEach(function (badge) {
      var steps = stepsOf(badge);
      edgeSteps[badge.getAttribute("data-edge-id")] = steps;
      badge.classList.toggle("on", state.step !== null && steps.indexOf(state.step) !== -1);
    });
    var onNodes = {}, stepNodes = {};
    edges.forEach(function (edge) {
      var steps = edgeSteps[edge.getAttribute("data-edge-id")];
      var inStep = !!steps && state.step !== null && steps.indexOf(state.step) !== -1;
      if (steps) {
        onNodes[edge.getAttribute("data-from")] = true;
        onNodes[edge.getAttribute("data-to")] = true;
        if (inStep) {
          stepNodes[edge.getAttribute("data-from")] = true;
          stepNodes[edge.getAttribute("data-to")] = true;
        }
      }
      edge.classList.toggle("flow-hl", flowOn && !!steps);
      edge.classList.toggle("flow-dim", flowOn && !steps);
      edge.classList.toggle("flow-fade", flowOn && !!steps && state.step !== null && !inStep);
    });
    nodes.forEach(function (node) {
      var p = node.getAttribute("data-path");
      node.classList.toggle("flow-dim", flowOn && !onNodes[p]);
      node.classList.toggle("flow-fade", flowOn && !!onNodes[p] && state.step !== null && !stepNodes[p]);
    });
  }

  /* ---- adapter (frame -> canvas commands) ---- */
  var adapter = {
    el: svg,
    highlight: function (mode, target) {
      if (mode === "hover") {
        state.hover = target && target.path != null ? target.path : null;
      } else if (mode === "select") {
        state.select = target && target.path != null ? target.path : null;
      } else if (mode === "flow") {
        state.flow = target && target.flowId != null ? target.flowId : null;
        state.step = null;
      } else if (mode === "step") {
        if (target && target.flowId != null) {
          state.flow = target.flowId;
          state.step = target.step != null ? target.step : null;
        } else {
          state.step = null;
        }
      }
      applyHighlight();
    },
    setLabelMode: function (mode) {
      labelMode = mode === "always" ? "always" : "auto";
      applyVB();
    },
    fit: function () {
      if (booted) return fitView();
      booted = true;
      bootView();
    },
    reset: function () { fitView(); },
    canvasShift: function (px) {
      svg.style.transform = px ? "translateX(" + px + "px)" : "";
    },
    refresh: function () {},
    "export": function () { return null; },
    toolbarExtras: function () { return null; }
  };

  /* ---- canvas -> frame callbacks (the frame hands them over at register;
     look on the register() return value first, then on the adapter object
     in case the frame stamps them there) ---- */
  var handle = null;
  function emit(name, a, b) {
    var fn = (handle && handle[name]) || adapter[name];
    if (typeof fn === "function") fn(a, b);
  }

  svg.addEventListener("click", function (ev) {
    if (moved) return;
    var t = ev.target instanceof Element ? ev.target : null;
    if ((!t || t === svg) && downTarget) t = downTarget;
    var badge = t ? t.closest(".flow-badge") : null;
    if (badge) {
      var layer = badge.closest(".flow-badges[data-flow]");
      if (!layer) return;
      /* cycle the merged badge's steps: none -> first -> ... -> last -> null */
      var steps = stepsOf(badge);
      var i = steps.indexOf(state.step);
      var next = i === -1 ? steps[0] : (i + 1 < steps.length ? steps[i + 1] : null);
      emit("onStepClicked", layer.getAttribute("data-flow"), next);
      return;
    }
    var node = t ? t.closest(".node[data-path]") : null;
    emit("onNodeSelected", node ? node.getAttribute("data-path") : null);
  });

  svg.addEventListener("dblclick", function (ev) {
    var t = ev.target instanceof Element ? ev.target : null;
    if ((!t || t === svg) && downTarget) t = downTarget;
    var node = t ? t.closest(".node[data-path]") : null;
    if (node) emit("onNodeActivated", node.getAttribute("data-path"));
    else fitView();
  });

  var hoverPath = null;
  svg.addEventListener("mouseover", function (ev) {
    var t = ev.target instanceof Element ? ev.target : null;
    var node = t ? t.closest(".node[data-path]") : null;
    var p = node ? node.getAttribute("data-path") : null;
    if (p !== hoverPath) { hoverPath = p; emit("onHover", p); }
  });
  svg.addEventListener("mouseleave", function () {
    if (hoverPath !== null) { hoverPath = null; emit("onHover", null); }
  });

  /* ---- register with the frame (retry briefly: script order is not ours) ---- */
  function register() {
    var frame = window.__zzonFrame;
    if (!frame || typeof frame.register !== "function") return false;
    handle = frame.register(adapter) || null;
    return true;
  }
  if (!register()) {
    var tries = 0;
    var timer = setInterval(function () {
      if (register() || ++tries > 50) clearInterval(timer);
    }, 40);
  }
  applyVB();
})();
</script>
