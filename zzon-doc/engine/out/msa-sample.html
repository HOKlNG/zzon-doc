:root{--ia-canvas:#FFFFFF;--ia-text:#16191F;--ia-edge:#545B64;--ia-dim:0.25;--cat-user:#64748b;--cat-frontend:#0ea5e9;--cat-backend:#8b5cf6;--cat-compute:#f59e0b;--cat-data:#10b981;--cat-data-aux:#14b8a6;--cat-edge:#f43f5e;--cat-external:#71717a;--cat-claude:#a855f7;--cat-neutral:#6b7280;}
:root[data-theme="dark"]{--ia-canvas:#161E2D;--ia-text:#D5DBDB;--ia-edge:#879596;--ia-dim:0.25;--cat-user:#94a3b8;--cat-frontend:#38bdf8;--cat-backend:#a78bfa;--cat-compute:#fbbf24;--cat-data:#34d399;--cat-data-aux:#2dd4bf;--cat-edge:#fb7185;--cat-external:#a1a1aa;--cat-claude:#c084fc;--cat-neutral:#9ca3af;--table-head:#1D2739;--table-border:#2E3B50;--table-zebra:rgba(125,137,152,0.12);--table-accent:#34D399;--table-fk:#38BDF8;--card:#1F2937;--border:#334155;--muted:#2B3648;--muted-foreground:#94A3B8;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ia-canvas:#161E2D;--ia-text:#D5DBDB;--ia-edge:#879596;--ia-dim:0.25;}}
html,body{margin:0;height:100%;background:var(--ia-canvas);color:var(--ia-text);font-family:Pretendard,sans-serif}
#ia-toolbar{display:flex;gap:12px;align-items:center;height:48px;padding:0 16px;box-sizing:border-box;border-bottom:1px solid rgba(125,137,152,.35);font-size:13px}
#ia-toolbar strong{margin-right:auto}
#ia-toolbar button{font:inherit;background:none;border:1px solid rgba(125,137,152,.5);border-radius:4px;color:inherit;padding:2px 10px;cursor:pointer}
#ia-layers{display:flex;gap:10px;align-items:center}
#ia-layers label{display:flex;gap:4px;align-items:center;cursor:pointer}
main{position:relative}
svg.ia-svg{display:block;width:100%;height:calc(100vh - 48px);cursor:grab}
.node,.edge{transition:opacity .15s ease}
.dim{opacity:var(--ia-dim)}
.hl{opacity:1}
.pulse{animation:ia-pulse .6s ease-in-out 4}
@keyframes ia-pulse{50%{opacity:.2}}
#ia-tooltip{position:absolute;z-index:10;max-width:320px;padding:8px 10px;border-radius:4px;background:var(--ia-canvas);color:var(--ia-text);border:1px solid rgba(125,137,152,.5);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:12px;line-height:1.5}
#ia-tooltip .k{font-weight:600;margin-right:6px}
.flow-badges{display:none}
.flow-badges.active{display:initial}
.flow-badge{cursor:pointer}
.flow-badge text{user-select:none}
.flow-badge.on circle{stroke:#FFFFFF;stroke-width:2.5}
.flow-dim{opacity:.25}
.flow-fade{opacity:.5}
.edge.flow-hl path{stroke:var(--flow,#4f46e5);stroke-width:2.25}
#ia-flows{position:absolute;left:12px;top:12px;z-index:5;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:60%;font-size:12px}
.flow-buttons{display:flex;flex-wrap:wrap;gap:6px}
.flow-btn{font:inherit;height:28px;padding:0 10px;border-radius:6px;cursor:pointer;border:1px solid rgba(125,137,152,.5);background:var(--ia-canvas);color:var(--ia-text)}
.flow-btn.active{background:var(--flow,#4f46e5);border-color:transparent;color:#fff}
.flow-strip{margin:0;padding:6px 10px;list-style:none;border-radius:8px;border:1px solid rgba(125,137,152,.5);background:var(--ia-canvas);max-width:340px}
.flow-strip[hidden]{display:none}
.flow-strip li{display:flex;gap:8px;align-items:baseline;padding:3px 4px;border-radius:4px;cursor:pointer;line-height:1.45}
.flow-strip li:hover{opacity:.8}
.flow-strip li.active{background:var(--flow,#4f46e5);color:#fff}
.flow-strip li .n{flex-shrink:0;font-weight:600;font-feature-settings:"tnum"}
@keyframes flow-pop{to{transform:scale(1)}}
.flow-badges.active .flow-badge{transform:scale(0);transform-box:fill-box;transform-origin:center;animation:flow-pop 280ms cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(var(--step-index,0)*220ms + 120ms)}
@media (prefers-reduced-motion:reduce){.flow-badges.active .flow-badge{animation:none;transform:scale(1)}}
:root{--panel-bg:#FFFFFF;--panel-text:#16191F;--panel-muted:#545B64;--panel-border:rgba(125,137,152,.35);--panel-hover:rgba(125,137,152,.14);--panel-chip:rgba(125,137,152,.16)}
:root[data-theme="dark"]{--panel-bg:#161E2D;--panel-text:#D5DBDB;--panel-muted:#879596;--panel-border:rgba(125,137,152,.5);--panel-hover:rgba(125,137,152,.24);--panel-chip:rgba(125,137,152,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel-bg:#161E2D;--panel-text:#D5DBDB;--panel-muted:#879596;--panel-border:rgba(125,137,152,.5);--panel-hover:rgba(125,137,152,.24);--panel-chip:rgba(125,137,152,.3)}}
.dg-sidebar{position:fixed;z-index:40;top:var(--panel-top,48px);right:0;bottom:0;width:304px;box-sizing:border-box;display:flex;flex-direction:column;border-left:1px solid var(--panel-border,rgba(125,137,152,.35));background:var(--panel-bg,#FFFFFF);color:var(--panel-text,#16191F);box-shadow:-10px 0 30px rgba(0,0,0,.1);transform:translateX(105%);visibility:hidden;transition:transform .2s ease,visibility .2s}
.dg-sidebar.open{transform:translateX(0);visibility:visible}
.dg-sidebar-head{display:flex;align-items:flex-start;gap:10px;padding:14px;border-bottom:1px solid var(--panel-border,rgba(125,137,152,.35))}
.dg-sidebar-titles{flex:1;min-width:0}
.dg-sidebar-title{font-size:14px;font-weight:600;line-height:1.25;overflow-wrap:break-word}
.dg-sidebar-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dg-chip{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:1px 7px;border-radius:999px;background:var(--panel-chip,rgba(125,137,152,.16));color:var(--panel-muted,#545B64)}
.dg-sidebar-close{flex-shrink:0;width:24px;height:24px;border:0;border-radius:5px;background:none;color:var(--panel-muted,#545B64);font:inherit;font-size:15px;line-height:1;cursor:pointer}
.dg-sidebar-close:hover{background:var(--panel-hover,rgba(125,137,152,.14))}
.dg-sidebar-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 18px;font-size:12px;line-height:1.6;color:var(--panel-muted,#545B64)}
.dg-sidebar-desc{margin:0 0 4px}
.dg-sidebar-conn-sec{margin:16px 0 6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dg-sidebar-conns{list-style:none;margin:0;padding:0}
.dg-conn{display:flex;align-items:center;gap:7px;padding:5px 8px;margin:0 -8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--panel-text,#16191F)}
.dg-conn:hover{background:var(--panel-hover,rgba(125,137,152,.14))}
.dg-conn .dir{flex-shrink:0;width:14px;text-align:center;font-weight:700;color:var(--panel-muted,#545B64)}
.dg-conn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-conn .kind{margin-left:auto;flex-shrink:0;padding-left:8px;font-size:10px;color:var(--panel-muted,#545B64)}
.dg-sidebar-foot{border-top:1px solid var(--panel-border,rgba(125,137,152,.35));padding:8px}
.dg-sidebar-href{display:block;height:28px;line-height:28px;padding:0 8px;border-radius:6px;font-size:12px;color:var(--panel-text,#16191F);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-sidebar-href:hover{background:var(--panel-hover,rgba(125,137,152,.14))}

.ia-legend{position:absolute;left:12px;bottom:12px;z-index:30;max-width:60%;
  border:1px solid var(--border,#e2e8f0);border-radius:8px;
  background:var(--card,#ffffff);padding:6px 12px 8px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);}
.ia-legend summary{cursor:pointer;font-size:11px;font-weight:600;
  color:var(--muted-foreground,#64748b);user-select:none;list-style:none;}
.ia-legend summary::-webkit-details-marker{display:none;}
.ia-legend[open] summary{margin-bottom:6px;}
.ia-legend-items{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;}
.ia-legend .item{display:inline-flex;align-items:center;gap:4px;font-size:11px;
  color:var(--muted-foreground,#64748b);}
.ia-legend .dot{width:8px;height:8px;border-radius:9999px;display:inline-block;}
.ia-legend .sep{width:1px;height:12px;background:var(--border,#e2e8f0);}

<script>(function () {
  "use strict";
  /* ---- theme: default from prefers-color-scheme, toggle via #ia-theme ---- */
  var root = document.documentElement;
  if (!root.hasAttribute("data-theme")) {
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", prefersDark ? "dark" : "light");
  }
  var themeBtn = document.getElementById("ia-theme");
  if (themeBtn) {
    themeBtn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      if (window.__zzonSetTheme) window.__zzonSetTheme(next);
      else root.setAttribute("data-theme", next);
    });
  }

  var svg = document.querySelector("svg.ia-svg");
  if (!svg) return;

  /* ---- pan / zoom (viewBox-based) ---- */
  var vb0 = (svg.getAttribute("viewBox") || "0 0 100 100").split(/\s+/).map(Number);
  var vb = vb0.slice();
  var MIN_ZOOM = 0.2, MAX_ZOOM = 8;
  function applyVB() { svg.setAttribute("viewBox", vb.join(" ")); }
  function resetView() { vb = vb0.slice(); applyVB(); }

  var pan = null;
  svg.addEventListener("pointerdown", function (ev) {
    if (ev.button !== 0) return;
    if (ev.target instanceof Element && ev.target.closest(".node")) return;
    pan = { x: ev.clientX, y: ev.clientY, vb: vb.slice() };
    if (svg.setPointerCapture) svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener("pointermove", function (ev) {
    if (!pan) return;
    var r = svg.getBoundingClientRect();
    vb[0] = pan.vb[0] - ((ev.clientX - pan.x) / r.width) * pan.vb[2];
    vb[1] = pan.vb[1] - ((ev.clientY - pan.y) / r.height) * pan.vb[3];
    applyVB();
  });
  ["pointerup", "pointercancel"].forEach(function (type) {
    svg.addEventListener(type, function () { pan = null; });
  });
  svg.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var r = svg.getBoundingClientRect();
    var px = vb[0] + ((ev.clientX - r.left) / r.width) * vb[2];
    var py = vb[1] + ((ev.clientY - r.top) / r.height) * vb[3];
    var factor = Math.pow(1.0015, ev.deltaY);
    var zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, vb0[2] / (vb[2] * factor)));
    factor = vb0[2] / zoom / vb[2];
    vb[0] = px - (px - vb[0]) * factor;
    vb[1] = py - (py - vb[1]) * factor;
    vb[2] = vb[2] * factor;
    vb[3] = vb[3] * factor;
    applyVB();
  }, { passive: false });
  svg.addEventListener("dblclick", resetView);
  var resetBtn = document.getElementById("ia-reset");
  if (resetBtn) resetBtn.addEventListener("click", resetView);

  /* ---- hover: highlight node + incident edges + neighbors, dim the rest ---- */
  var nodes = Array.prototype.slice.call(svg.querySelectorAll(".node"));
  var edges = Array.prototype.slice.call(svg.querySelectorAll(".edge"));
  var all = nodes.concat(edges);
  function clearHl() {
    all.forEach(function (el) { el.classList.remove("hl"); el.classList.remove("dim"); });
  }
  nodes.forEach(function (node) {
    node.addEventListener("mouseenter", function () {
      var path = node.getAttribute("data-path");
      var lit = new Set([node]);
      edges.forEach(function (edge) {
        var from = edge.getAttribute("data-from");
        var to = edge.getAttribute("data-to");
        if (from !== path && to !== path) return;
        lit.add(edge);
        var other = from === path ? to : from;
        nodes.forEach(function (n) { if (n.getAttribute("data-path") === other) lit.add(n); });
      });
      all.forEach(function (el) {
        el.classList.toggle("hl", lit.has(el));
        el.classList.toggle("dim", !lit.has(el));
      });
    });
    node.addEventListener("mouseleave", clearHl);
  });

  /* ---- click node with data-meta -> positioned key/value tooltip ---- */
  var tip = document.createElement("div");
  tip.id = "ia-tooltip";
  tip.hidden = true;
  document.body.appendChild(tip);
  document.addEventListener("click", function (ev) {
    var target = ev.target instanceof Element ? ev.target : null;
    var node = target ? target.closest(".node[data-meta]") : null;
    if (!node) { tip.hidden = true; return; }
    var meta;
    try { meta = JSON.parse(node.getAttribute("data-meta")); } catch (err) { return; }
    tip.textContent = "";
    Object.keys(meta).forEach(function (key) {
      var row = document.createElement("div");
      var k = document.createElement("span");
      k.className = "k";
      k.textContent = key;
      row.appendChild(k);
      row.appendChild(document.createTextNode(String(meta[key])));
      tip.appendChild(row);
    });
    tip.style.left = (ev.pageX + 12) + "px";
    tip.style.top = (ev.pageY + 12) + "px";
    tip.hidden = false;
  });

  /* ---- layer toggles, auto-generated from layer-<name> classes ---- */
  var layersBox = document.getElementById("ia-layers");
  if (layersBox) {
    var layerNames = [];
    svg.querySelectorAll("[class]").forEach(function (el) {
      el.classList.forEach(function (cls) {
        if (cls.indexOf("layer-") === 0 && layerNames.indexOf(cls.slice(6)) < 0) {
          layerNames.push(cls.slice(6));
        }
      });
    });
    layerNames.sort();
    layerNames.forEach(function (name) {
      var label = document.createElement("label");
      var box = document.createElement("input");
      box.type = "checkbox";
      box.checked = true;
      box.addEventListener("change", function () {
        svg.querySelectorAll(".layer-" + name).forEach(function (el) {
          el.style.display = box.checked ? "" : "none";
        });
      });
      label.appendChild(box);
      label.appendChild(document.createTextNode(" " + name));
      layersBox.appendChild(label);
    });
  }

  /* ---- "#<path>" deep link: pulse + scroll into view ---- */
  function jumpToHash() {
    var hash = decodeURIComponent(location.hash.slice(1));
    if (!hash) return;
    var el = null;
    svg.querySelectorAll("[data-path]").forEach(function (candidate) {
      if (candidate.getAttribute("data-path") === hash) el = candidate;
    });
    if (!el) return;
    el.classList.add("pulse");
    setTimeout(function () { el.classList.remove("pulse"); }, 2600);
    if (el.scrollIntoView) el.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
  }
  window.addEventListener("hashchange", jumpToHash);
  jumpToHash();
})();</script>
<script>(function () {
  "use strict";
  var svg = document.querySelector("svg.ia-svg");
  var box = document.getElementById("ia-flows");
  if (!svg || !box) return;
  var buttons = Array.prototype.slice.call(box.querySelectorAll(".flow-btn[data-flow]"));
  var strips = Array.prototype.slice.call(box.querySelectorAll(".flow-strip[data-flow]"));
  var layers = Array.prototype.slice.call(svg.querySelectorAll(".flow-badges[data-flow]"));
  var edges = Array.prototype.slice.call(svg.querySelectorAll(".edge[data-edge-id]"));
  var nodes = Array.prototype.slice.call(svg.querySelectorAll(".node[data-path]"));
  var activeFlow = null, activeStep = null;

  function badgesOf(flowId) {
    for (var i = 0; i < layers.length; i++) {
      if (layers[i].getAttribute("data-flow") === flowId) {
        return Array.prototype.slice.call(layers[i].querySelectorAll(".flow-badge"));
      }
    }
    return [];
  }
  function stepsOf(badge) {
    return (badge.getAttribute("data-steps") || "").split(" ").map(Number);
  }

  function apply() {
    var on = activeFlow !== null;
    layers.forEach(function (l) { l.classList.toggle("active", l.getAttribute("data-flow") === activeFlow); });
    strips.forEach(function (s) { s.hidden = s.getAttribute("data-flow") !== activeFlow; });
    buttons.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-flow") === activeFlow); });

    /* active flow's edge -> step numbers; badge ring while its step is focused */
    var edgeSteps = {};
    badgesOf(activeFlow).forEach(function (badge) {
      var steps = stepsOf(badge);
      edgeSteps[badge.getAttribute("data-edge-id")] = steps;
      badge.classList.toggle("on", activeStep !== null && steps.indexOf(activeStep) !== -1);
    });

    /* on-path nodes = endpoints of step edges; step focus half-dims the rest */
    var onNodes = {}, stepNodes = {};
    edges.forEach(function (edge) {
      var steps = edgeSteps[edge.getAttribute("data-edge-id")];
      var inStep = !!steps && activeStep !== null && steps.indexOf(activeStep) !== -1;
      if (steps) {
        onNodes[edge.getAttribute("data-from")] = true;
        onNodes[edge.getAttribute("data-to")] = true;
        if (inStep) {
          stepNodes[edge.getAttribute("data-from")] = true;
          stepNodes[edge.getAttribute("data-to")] = true;
        }
      }
      edge.classList.toggle("flow-hl", on && !!steps);
      edge.classList.toggle("flow-dim", on && !steps);
      edge.classList.toggle("flow-fade", on && !!steps && activeStep !== null && !inStep);
    });
    nodes.forEach(function (node) {
      var p = node.getAttribute("data-path");
      node.classList.toggle("flow-dim", on && !onNodes[p]);
      node.classList.toggle("flow-fade", on && !!onNodes[p] && activeStep !== null && !stepNodes[p]);
    });
    strips.forEach(function (s) {
      var mine = s.getAttribute("data-flow") === activeFlow;
      Array.prototype.slice.call(s.querySelectorAll("[data-step]")).forEach(function (li) {
        li.classList.toggle("active", mine && Number(li.getAttribute("data-step")) === activeStep);
      });
    });
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.getAttribute("data-flow");
      activeFlow = activeFlow === id ? null : id;
      activeStep = null;
      apply();
    });
  });
  strips.forEach(function (s) {
    s.addEventListener("click", function (ev) {
      var li = ev.target instanceof Element ? ev.target.closest("[data-step]") : null;
      if (!li) return;
      var n = Number(li.getAttribute("data-step"));
      activeStep = activeStep === n ? null : n;
      apply();
    });
  });
  /* badge click cycles through its steps (legacy: "1·4" -> 1 -> 4 -> none) */
  svg.addEventListener("click", function (ev) {
    var badge = ev.target instanceof Element ? ev.target.closest(".flow-badge") : null;
    if (!badge || activeFlow === null) return;
    ev.stopPropagation();
    var steps = stepsOf(badge);
    var i = steps.indexOf(activeStep);
    activeStep = i === -1 ? steps[0] : (i + 1 < steps.length ? steps[i + 1] : null);
    apply();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && activeFlow !== null) {
      activeFlow = null;
      activeStep = null;
      apply();
    }
  });
})();</script>
<script>(function () {
  "use strict";
  var root = document.documentElement;

  /* ---- theme boot: localStorage "zzon-theme" wins, OS preference fallback ---- */
  var theme = null;
  try { theme = localStorage.getItem("zzon-theme"); } catch (err) {}
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark" : "light";
  }
  root.dataset.theme = theme;
  window.__zzonSetTheme = function (t) {
    if (t !== "light" && t !== "dark") return;
    root.dataset.theme = t;
    try { localStorage.setItem("zzon-theme", t); } catch (err) {}
  };
  /* other iframes / the shell persisting the key restyle this page live */
  window.addEventListener("storage", function (ev) {
    if (ev.key !== "zzon-theme") return;
    if (ev.newValue === "light" || ev.newValue === "dark") root.dataset.theme = ev.newValue;
  });

  /* ---- drilldown: sibling slug inside the docs shell, full URL otherwise ---- */
  function navigateHref(href) {
    if (!href) return;
    var slug = String(href).replace(/\.html$/i, "");
    if (/^[a-z0-9_-]+$/.test(slug)) {
      if (window.parent !== window) {
        window.parent.postMessage({ type: "zzon:navigate", slug: slug }, "*");
      } else {
        window.location.href = slug + ".html";
      }
      return;
    }
    window.open(href, "_blank", "noopener");
  }

  var aside = document.querySelector(".dg-sidebar");
  var svg = document.querySelector("svg.ia-svg");
  if (!aside || !svg) return;
  var pick = function (sel) { return aside.querySelector(sel); };
  var titleEl = pick(".dg-sidebar-title");
  var catEl = pick(".dg-chip-category");
  var techEl = pick(".dg-chip-tech");
  var descEl = pick(".dg-sidebar-desc");
  var connSec = pick(".dg-sidebar-conn-sec");
  var connsEl = pick(".dg-sidebar-conns");
  var footEl = pick(".dg-sidebar-foot");
  var hrefEl = pick(".dg-sidebar-href");
  var nodes = Array.prototype.slice.call(svg.querySelectorAll(".node"));
  var edges = Array.prototype.slice.call(svg.querySelectorAll(".edge"));
  var isOpen = false;
  var currentHref = null;

  /* open/close tells the parent shell so its left menu stays mutually exclusive */
  function setOpen(open) {
    if (isOpen === open) return;
    isOpen = open;
    aside.classList.toggle("open", open);
    if (window.parent !== window) {
      window.parent.postMessage({ type: "zzon:sidebar", open: !!open }, "*");
    }
  }

  function nodeByPath(path) {
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].getAttribute("data-path") === path) return nodes[i];
    }
    return null;
  }
  function labelOf(node) {
    var label = node.getAttribute("data-label");
    if (label) return label;
    return (node.getAttribute("data-path") || "").split("/").pop();
  }
  function setChip(chip, value) {
    chip.hidden = !value;
    chip.textContent = value || "";
  }

  function select(node) {
    var path = node.getAttribute("data-path");
    titleEl.textContent = labelOf(node);
    setChip(catEl, node.getAttribute("data-category"));
    setChip(techEl, node.getAttribute("data-tech"));
    var desc = node.getAttribute("data-desc");
    descEl.hidden = !desc;
    descEl.textContent = desc || "";

    /* connections: scan edge endpoints (data-from/data-to) for this node's path */
    connsEl.textContent = "";
    var count = 0;
    edges.forEach(function (edge) {
      var from = edge.getAttribute("data-from");
      var to = edge.getAttribute("data-to");
      if (from !== path && to !== path) return;
      var outgoing = from === path;
      var other = nodeByPath(outgoing ? to : from);
      if (!other) return; /* endpoint is a group/rail item — no node entry */
      count++;
      var li = document.createElement("li");
      li.className = "dg-conn";
      var dir = document.createElement("span");
      dir.className = "dir";
      dir.textContent = outgoing ? "\u2192" : "\u2190";
      li.appendChild(dir);
      var lbl = document.createElement("span");
      lbl.className = "lbl";
      lbl.textContent = labelOf(other);
      li.appendChild(lbl);
      var edgeText = edge.querySelector("text");
      if (edgeText && edgeText.textContent) {
        var kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = edgeText.textContent;
        li.appendChild(kind);
      }
      li.addEventListener("click", function () { select(other); });
      connsEl.appendChild(li);
    });
    connSec.textContent = "Connections (" + count + ")";
    connSec.hidden = count === 0;

    currentHref = node.getAttribute("data-href");
    footEl.hidden = !currentHref;
    hrefEl.textContent = "Details: " + (currentHref || "");
    hrefEl.title = currentHref || "";
    setOpen(true);
  }

  nodes.forEach(function (node) {
    node.addEventListener("click", function () { select(node); });
    node.addEventListener("dblclick", function (ev) {
      var href = node.getAttribute("data-href");
      if (!href) return;
      ev.stopPropagation(); /* keep the canvas dblclick view-reset from firing */
      navigateHref(href);
    });
  });
  hrefEl.addEventListener("click", function (ev) {
    ev.preventDefault();
    navigateHref(currentHref);
  });
  pick(".dg-sidebar-close").addEventListener("click", function () { setOpen(false); });

  /* ---- parent shell reopened its menu -> close this sidebar ---- */
  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (d && d.type === "zzon:sidebar-close") setOpen(false);
  });
  window.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") setOpen(false);
  });
})();</script>
